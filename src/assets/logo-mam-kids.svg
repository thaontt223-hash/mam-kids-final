<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 190" width="680" height="190">
  <defs>
    <!-- Warm Pastel Sun Gradient -->
    <radialGradient id="sunGrad" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFF0A8" />
      <stop offset="65%" stop-color="#F9CE65" />
      <stop offset="100%" stop-color="#F4B740" />
    </radialGradient>

    <!-- Left Leaf Gradient -->
    <linearGradient id="leafLeftGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#355F52" />
      <stop offset="100%" stop-color="#4E8773" />
    </linearGradient>

    <!-- Right Leaf Gradient -->
    <linearGradient id="leafRightGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4E8773" />
      <stop offset="100%" stop-color="#68A98E" />
    </linearGradient>
  </defs>

  <!-- 1. ICON (Tender Sprout + Warm Pastel Sun) -->
  <g id="brand-icon">
    <!-- Soft Warm Pastel Sun -->
    <circle cx="95" cy="112" r="52" fill="url(#sunGrad)" />

    <!-- Sprout Stem -->
    <path
      d="M 95 152 C 95.5 118 93.5 84 95 52"
      stroke="#355F52"
      stroke-width="9"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Left Tender Leaf -->
    <path
      d="M 93 82 C 60 72 42 96 55 122 C 76 126 91 104 93 82 Z"
      fill="url(#leafLeftGrad)"
    />

    <!-- Right Tender Leaf -->
    <path
      d="M 97 64 C 128 50 152 75 139 105 C 118 109 101 87 97 64 Z"
      fill="url(#leafRightGrad)"
    />

    <!-- Tender Leaf highlight dot -->
    <circle cx="95" cy="50" r="3.2" fill="#FFF5C0" />
  </g>

