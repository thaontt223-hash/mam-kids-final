<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&amp;family=Be+Vietnam+Pro:wght@600;700&amp;display=swap');
      .circle-brand-mam-dark {
        font-family: 'Baloo 2', 'Quicksand', 'Be Vietnam Pro', -apple-system, sans-serif;
        font-weight: 800;
        font-size: 38px;
        letter-spacing: -0.5px;
      }
      .circle-brand-kids-dark {
        font-family: 'Baloo 2', 'Quicksand', 'Be Vietnam Pro', -apple-system, sans-serif;
        font-weight: 700;
        font-size: 34px;
        letter-spacing: -0.2px;
      }
      .circle-subtag-dark {
        font-family: 'Be Vietnam Pro', 'Quicksand', sans-serif;
        font-weight: 700;
        font-size: 10px;
        letter-spacing: 2.8px;
      }
    </style>

    <radialGradient id="circleDarkBg" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#366555" />
      <stop offset="70%" stop-color="#2D5547" />
      <stop offset="100%" stop-color="#214237" />
    </radialGradient>

    <linearGradient id="leafDarkLeft" x1="20%" y1="100%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#56B889" />
      <stop offset="100%" stop-color="#A5F3CB" />
    </linearGradient>

    <linearGradient id="leafDarkRight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#72D1A3" />
      <stop offset="100%" stop-color="#C2F9DC" />
    </linearGradient>
  </defs>

  <!-- Nền tròn tối sang trọng -->
  <circle cx="200" cy="200" r="184" fill="url(#circleDarkBg)" />
  <circle cx="200" cy="200" r="176" fill="none" stroke="#F5DFA0" stroke-opacity="0.3" stroke-width="1.6" stroke-dasharray="4 3.5" />

  <!-- Biểu tượng chính -->
  <g transform="translate(0, 5)">
    <!-- Đốm đất màu mỡ -->
    <path d="M 178 244 C 188 239 212 239 222 244 C 218 249 182 249 178 244 Z" fill="#F5DFA0" opacity="0.3" />

    <!-- Thân mầm -->
    <path d="M 200 242 C 200 216 198 188 200 162" stroke="#8CE0B6" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Hai lá mầm lớn -->
    <path
      d="M 197 225
         C 155 220 125 178 132 138
         C 142 125 162 130 178 148
         C 192 165 198 198 197 225 Z"
      fill="url(#leafDarkLeft)"
      stroke="#FFFFFF"
      stroke-width="1.2"
    />
    <path d="M 194 220 C 172 188 152 162 142 143" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <path
      d="M 203 227
         C 242 225 272 185 266 146
         C 256 133 238 138 222 154
         C 208 170 202 201 203 227 Z"
      fill="url(#leafDarkRight)"
      stroke="#FFFFFF"
      stroke-width="1.2"
    />
    <path d="M 206 222 C 226 192 244 168 254 150" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- Chồi non nhỏ -->
    <path d="M 198 140 C 193 124 200 112 205 110 C 208 116 206 130 201 140 Z" fill="#F5DFA0" stroke="#FFFFFF" stroke-width="1.2" />

    <!-- Áo em bé -->
    <g transform="translate(162, 126)">
      <path
        d="M 24 16
           L 11 23 C 9 24.5 9 27.5 10.5 29.5 L 14.5 35 C 16 37 19 37 20.5 35 L 23.5 32
           L 23.5 48 C 23.5 52 26 55 30 55
           L 46 55 C 50 55 52.5 52 52.5 48
           L 52.5 32 L 55.5 35 C 57 37 60 37 61.5 35 L 65.5 29.5 C 67 27.5 67 24.5 65 23
           L 52 16
           C 48 20.5 42.5 22.5 38 22.5 C 33.5 22.5 28 20.5 24 16 Z"
        fill="#FFFFFF"
        stroke="#F5DFA0"
        stroke-width="2.2"
        stroke-linejoin="round"
        stroke-linecap="round"
      />
      <path d="M 28 14 C 33 19 43 19 48 14" stroke="#355F52" stroke-width="1.8" stroke-linecap="round" fill="none" />
      <circle cx="38" cy="34" r="2.2" fill="#ECA032" />
      <circle cx="38" cy="42" r="2.2" fill="#ECA032" />
      <!-- Móc áo -->
      <path d="M 16 17 C 26 10 33 8 38 8 C 43 8 50 10 60 17" stroke="#F5DFA0" stroke-width="3.2" stroke-linecap="round" fill="none" />
      <path d="M 38 8 L 38 2 C 38 -2 41.5 -5 45 -5 C 48.5 -5 51 -2.5 51 1 C 51 3.5 49 5.5 46.5 5.5" stroke="#F5DFA0" stroke-width="2.6" stroke-linecap="round" fill="none" />
    </g>
  </g>

  <!-- Typography -->
  <g transform="translate(0, 0)">
    <text x="116" y="308" class="circle-brand-mam-dark" fill="#FFFFFF">Mầm</text>
    <text x="208" y="308" class="circle-brand-kids-dark" fill="#F5DFA0">Kids</text>
    <path d="M 242 288 C 246 285 249 287 248 290 C 246 291 243 290 242 288 Z" fill="#8CE0B6" />
    <circle cx="241.5" cy="288.5" r="2" fill="#FFFFFF" />

    <!-- Subtag -->
    <g transform="translate(112, 328)">
      <rect x="0" y="0" width="176" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.12" stroke="#F5DFA0" stroke-opacity="0.4" stroke-width="1.2" />
      <text x="88" y="14.8" text-anchor="middle" class="circle-subtag-dark" fill="#F5DFA0">THỜI TRANG TRẺ EM</text>
    </g>
  </g>

  <!-- Viền ngoài hình tròn -->
  <circle cx="200" cy="200" r="184" fill="none" stroke="#F5DFA0" stroke-width="7" />
</svg>
